spring.application.name=Veterinaria

# Conexión a base de datos real: PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/veterinaria
spring.datasource.username=esteban
spring.datasource.password=123
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA: Crea o actualiza las tablas automáticamente al arrancar
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Puerto del servidor
server.port=9090
